name : Frontend CI Pipeline

on : 
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs :
    quality-check :
        name: Lint and Build
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version : '24'
                    cache: 'npm'

            -   name: Install Depedencies
                run: npm ci
            
            -   name: Run Eslint
                run: npm run lint
            
            -   name: Test Build
                run: npm run build





            